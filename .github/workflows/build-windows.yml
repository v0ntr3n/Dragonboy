name: Build Windows x64

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'GameProject/DragonBoy250/**'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

concurrency:
  group: windows-x64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Unity 6 / Windows x64
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
    steps:
      - name: Validate Unity license configuration
        shell: bash
        run: |
          if [[ -z "$UNITY_LICENSE" && -z "$UNITY_SERIAL" ]]; then
            echo "::error::Unity license missing. Add UNITY_LICENSE (Personal) or UNITY_SERIAL (Pro) in Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [[ -z "$UNITY_EMAIL" || -z "$UNITY_PASSWORD" ]]; then
            echo "::error::UNITY_EMAIL and UNITY_PASSWORD GitHub Actions secrets are required."
            exit 1
          fi

      - name: Checkout source and LFS assets
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: GameProject/DragonBoy250/Library
          key: unity-6000.3.9f1-windows-x64-${{ hashFiles('GameProject/DragonBoy250/Assets/**', 'GameProject/DragonBoy250/Packages/**', 'GameProject/DragonBoy250/ProjectSettings/**') }}
          restore-keys: |
            unity-6000.3.9f1-windows-x64-

      - name: Build Windows x64 with Unity
        uses: game-ci/unity-builder@v6
        with:
          projectPath: GameProject/DragonBoy250
          unityVersion: 6000.3.9f1
          targetPlatform: StandaloneWindows64
          buildMethod: DragonBoy.Build.BuildPlayerCLI.Build
          customParameters: >-
            -outputFolderPattern ../../build/StandaloneWindows64
            -buildName DragonBoy250

      - name: Verify executable and supporting data
        shell: bash
        run: |
          test -f build/StandaloneWindows64/DragonBoy250.exe || {
            echo "::error::Missing DragonBoy250.exe after Unity build."
            exit 1
          }
          test -d build/StandaloneWindows64/DragonBoy250_Data || {
            echo "::error::Missing DragonBoy250_Data after Unity build."
            exit 1
          }

      - name: Upload Windows game
        uses: actions/upload-artifact@v4
        with:
          name: DragonBoy250-Windows-x64
          path: build/StandaloneWindows64/
          if-no-files-found: error
          retention-days: 14
